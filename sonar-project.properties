# Analyse SonarQube / SonarCloud (sonar-scanner).
# La clé de projet, l'URL du serveur et le token restent fournis par le
# pipeline (sonar.projectKey, sonar.host.url, sonar.token) : ne pas les
# dupliquer ici — ce fichier ne porte que la portée de l'analyse.
sonar.sources=.

# storage/ contient l'archive figée de l'application v1 (pgcc-v1-before-
# password-compat-20261022) : code historique volontairement non corrigé,
# inaccessible par le web (règle [F] du .htaccess). Exclu des analyses.
sonar.exclusions=**/storage/**
